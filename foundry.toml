[profile.default]
src = "src"
out = "out"
libs = ["lib/yieldnest-vault/lib"]
test = "test"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.24"
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./" },
]

[rpc_endpoints]
mainnet = "${ETH_MAINNET_RPC_URL}"
